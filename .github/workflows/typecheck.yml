name: Typecheck & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # Lints only files changed in the PR, not the whole repo. The full
  # codebase currently has ~44 pre-existing lint errors unrelated to any
  # given change — gating merges on those would block every PR on
  # unrelated tech debt. This instead fails only when a PR's own changed
  # lines introduce a new error, the same check done by hand throughout
  # development (`git diff <file> | grep "^@@"` cross-referenced against
  # eslint output) — formalized here instead of relying on memory.
  lint-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.ts
            **/*.tsx
      - if: steps.changed.outputs.any_changed == 'true'
        run: npx eslint ${{ steps.changed.outputs.all_changed_files }}
