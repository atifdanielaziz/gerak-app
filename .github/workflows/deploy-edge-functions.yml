name: Deploy Edge Functions

# Auto-deploys only the edge functions whose folder actually changed in
# this push, instead of redeploying all 8 on every unrelated commit.
# Needs SUPABASE_ACCESS_TOKEN as a repo secret (Supabase dashboard ->
# Account -> Access Tokens -> generate one, then add it under this repo's
# Settings -> Secrets and variables -> Actions). Until that secret exists
# this workflow will fail loudly on the login step rather than silently
# no-op, so it's obvious it still needs wiring up.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

env:
  SUPABASE_PROJECT_ID: koyyautvmimuhjygqqfv

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detect changed functions
        id: changed
        run: |
          FUNCS=$(git diff --name-only HEAD^ HEAD -- supabase/functions | cut -d/ -f3 | sort -u | tr '\n' ' ')
          echo "list=$FUNCS" >> "$GITHUB_OUTPUT"
          echo "Changed functions: $FUNCS"

      - name: Deploy changed functions
        if: steps.changed.outputs.list != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in ${{ steps.changed.outputs.list }}; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_ID"
          done
